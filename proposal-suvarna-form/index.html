<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suvarna Pool Villas — AI Front Desk Demo by Rejig Labs</title>
<!--
  DEMO PROTOTYPE for wayfinder ticket #195 (round 3, adk-rut/rejiglabs-workspace).
  Rejig Labs brand chrome; Suvarna is the showcased project (never "Thalang Villa").
  Form = one-question-per-screen wizard on the #194 locked question set.
  Q1 country picker sets the language (overridable via the flag switch).
  Unit data is real (../suvarna-image-doc/ plan set). Prices except Type A's
  12.99M anchor are placeholders, marked * and covered by the footer disclaimer.
  ONE section is exempt from "the demo need not be accurate": ownership structure
  (Thai land law). It is framed, never asserted, per #182 Notes + #194 decision 4.
  No backend: all client-side, offline, single file.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Instrument+Serif:ital@0;1&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f8fc;
    --bg-alt: #eef1f8;
    --card: #ffffff;
    --ink: #1a1d2e;
    --ink-soft: #5a6074;
    --accent: #0033cc;
    --accent-hi: #0044ee;
    --glow: rgba(0,51,204,0.10);
    --border: rgba(0,51,204,0.10);
    --border-hi: rgba(0,51,204,0.32);
    --dark: #000818;
    --bar-muted: #7e88a0;
    --ok: #2e6b4f;
    --gold: #c19a44;
    --ease: cubic-bezier(0.16,1,0.3,1);
    --font: 'Instrument Sans', 'Noto Sans Thai', -apple-system, "Segoe UI", sans-serif;
    --head: 'Instrument Serif', 'Noto Sans Thai', Georgia, serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--ink);
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 0 20px; }

  /* ---------- header: Rejig Labs demo chrome ---------- */
  header {
    background: var(--dark);
    color: #fff;
    padding: 14px 0;
    position: sticky; top: 0; z-index: 10;
  }
  header .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .brand { display: flex; align-items: baseline; gap: 12px; }
  .brand-name { font-family: var(--head); font-style: italic; font-size: 1.3rem; color: #fff; letter-spacing: -0.01em; }
  .brand-sub {
    font-size: 0.62rem; letter-spacing: 0.22em; text-transform: uppercase;
    color: rgba(255,255,255,0.6); border-left: 1px solid rgba(255,255,255,0.25); padding-left: 12px;
  }
  .langs { display: flex; gap: 8px; }
  .langs button {
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.18);
    font-size: 1.05rem; line-height: 1; padding: 6px 9px; border-radius: 999px; cursor: pointer;
    transition: transform 0.2s var(--ease), border-color 0.2s var(--ease), background 0.2s var(--ease);
  }
  .langs button:hover { transform: translateY(-1px); }
  .langs button.on { background: #fff; border-color: #fff; box-shadow: 0 0 0 2px var(--accent-hi); }

  .demo-badge {
    position: fixed; bottom: 14px; left: 14px; z-index: 20;
    background: var(--accent); color: #fff; font-size: 0.68rem; letter-spacing: 0.06em;
    padding: 5px 12px; border-radius: 999px; box-shadow: 0 8px 24px -10px var(--accent);
  }

  /* ---------- hero ---------- */
  .hero { min-height: calc(100vh - 58px); display: flex; flex-direction: column; justify-content: center;
          padding: 40px 0 56px; text-align: center; position: relative; overflow: hidden; }
  .hero-blob {
    position: absolute; width: 480px; height: 480px; border-radius: 50%;
    background: radial-gradient(circle, var(--glow) 0%, transparent 65%);
    top: -140px; left: 50%; transform: translateX(-50%);
    animation: blob-drift 14s ease-in-out infinite alternate; pointer-events: none;
  }
  @keyframes blob-drift {
    from { transform: translateX(-65%) scale(1); }
    to   { transform: translateX(-35%) scale(1.15); }
  }
  .hero > *:not(.hero-blob) { position: relative; }
  .eyebrow {
    font-size: 0.68rem; letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--accent); font-weight: 600; margin-bottom: 14px;
  }
  .hero h1 {
    font-family: var(--head); font-weight: 400; letter-spacing: -0.01em;
    font-size: clamp(1.9rem, 5vw, 2.9rem); line-height: 1.22;
    max-width: 640px; margin: 0 auto 14px;
  }
  .hero .price-line { font-size: 1.05rem; color: var(--accent); font-weight: 600; margin-bottom: 8px; }
  .hero .sub { color: var(--ink-soft); font-size: 0.95rem; max-width: 540px; margin: 0 auto 30px; }
  .cta {
    display: inline-block; background: var(--accent); color: #fff; border: none; cursor: pointer;
    font: inherit; font-size: 1rem; font-weight: 600; padding: 14px 36px; border-radius: 999px;
    box-shadow: 0 8px 24px -10px var(--accent);
    transition: transform 0.25s var(--ease), background 0.25s var(--ease);
  }
  .cta:hover { transform: translateY(-2px); background: var(--accent-hi); }
  .hero .cta { align-self: center; }  /* stop the flex column stretching the pill full-width */

  /* ---------- cards + reveal animation ---------- */
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 16px;
    padding: 28px; margin-bottom: 22px; box-shadow: 0 2px 12px rgba(0,8,24,0.04);
  }
  [data-anim] { opacity: 0; transform: translateY(24px); transition: opacity 0.7s var(--ease), transform 0.7s var(--ease); }
  [data-anim].in { opacity: 1; transform: none; }

  /* ---------- wizard modal (full-screen, opens on CTA click) ---------- */
  .modal { position: fixed; inset: 0; z-index: 100; display: none; }
  .modal.open { display: block; }
  .modal-backdrop { position: absolute; inset: 0; background: rgba(0,8,24,0.72); backdrop-filter: blur(5px);
    opacity: 0; animation: modal-fade 0.4s var(--ease) forwards; }
  .modal-sheet {
    position: relative; width: 100%; height: 100%; margin: 0; overflow: hidden;
    background: var(--bg); display: flex; flex-direction: column;
    transform: translateY(40px) scale(0.992); opacity: 0;
    animation: modal-sheet-in 0.55s var(--ease) 0.05s forwards;
  }
  /* cinematic ambient light, drifting behind the content for depth */
  .modal-sheet::before { content: ""; position: absolute; top: -14%; left: 50%; width: 820px; height: 820px;
    transform: translateX(-50%); border-radius: 50%; pointer-events: none; z-index: 0;
    background: radial-gradient(circle, var(--glow) 0%, transparent 62%);
    animation: blob-drift 16s ease-in-out infinite alternate; }
  @keyframes modal-fade { to { opacity: 1; } }
  @keyframes modal-sheet-in { to { transform: none; opacity: 1; } }
  .modal-bar { position: relative; z-index: 2; display: flex; align-items: center; gap: 16px;
    padding: 22px clamp(24px, 6vw, 72px) 16px; background: transparent; }
  .progress { flex: 1; height: 6px; background: var(--bg-alt); border-radius: 999px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--accent); border-radius: 999px;
    transform-origin: left; transform: scaleX(0); transition: transform 0.65s var(--ease); }
  .modal-close { flex-shrink: 0; background: var(--bg-alt); border: none; width: 34px; height: 34px;
    border-radius: 50%; font-size: 1.4rem; line-height: 1; color: var(--ink-soft); cursor: pointer;
    transition: background 0.2s var(--ease), transform 0.15s var(--ease); }
  .modal-close:hover { background: #e1e6f2; transform: rotate(90deg); }
  .modal-body { position: relative; z-index: 1; flex: 1; overflow-y: auto;
    display: flex; flex-direction: column; justify-content: center; padding: 24px clamp(24px, 6vw, 72px) 56px; }
  .modal-inner { width: 100%; max-width: 620px; margin: 0 auto; }
  /* real-estate flourish: a blueprint scan-line that sweeps on each step change */
  .flourish { height: 2px; margin: 0 0 22px; border-radius: 2px; overflow: hidden; }
  .flourish::before { content: ""; display: block; height: 100%; width: 100%; transform: translateX(-105%);
    background: linear-gradient(90deg, transparent, var(--accent) 45%, var(--accent-hi) 55%, transparent); }
  .flourish.play::before { animation: blueprint-sweep 0.62s var(--ease); }
  @keyframes blueprint-sweep { to { transform: translateX(105%); } }
  .wiz-top { display: flex; align-items: center; min-height: 22px; margin-bottom: 4px; }
  .back-btn {
    background: none; border: none; font: inherit; font-size: 0.85rem; color: var(--ink-soft);
    cursor: pointer; padding: 4px 6px; border-radius: 8px; visibility: hidden;
  }
  .back-btn:hover { color: var(--accent); background: var(--bg-alt); }
  .back-btn.show { visibility: visible; }
  .wiz-step { flex: 1; }
  @keyframes step-in { to { opacity: 1; transform: none; } }
  /* card morph-in: the step materialises out of a compressed, blurred state and settles into shape */
  .wiz-anim { opacity: 0; transform: scale(0.9); filter: blur(9px); transform-origin: center 42%;
    animation: card-morph-in 0.5s var(--ease) forwards; }
  @keyframes card-morph-in {
    60%  { filter: blur(0); }
    to   { opacity: 1; transform: none; filter: blur(0); } }
  /* card morph-out: the outgoing step swells and dissolves before the next morphs in */
  .wiz-anim.exit { animation: card-morph-out 0.3s cubic-bezier(0.4,0,0.7,0.2) forwards; }
  @keyframes card-morph-out { to { opacity: 0; transform: scale(1.06); filter: blur(6px); } }
  .wiz-eyebrow { text-transform: uppercase; letter-spacing: 0.22em; font-size: 0.72rem; font-weight: 600;
    color: var(--gold); margin-bottom: 12px; opacity: 0; animation: step-in 0.5s var(--ease) 0.05s forwards; }
  .wiz-q { font-family: var(--head); font-weight: 400; font-size: clamp(1.7rem, 4.5vw, 2.5rem); line-height: 1.2; margin-bottom: 8px; }
  /* gold rule draws itself under the question once the words land */
  .wiz-q::after { content: ""; display: block; height: 2px; width: 0; background: var(--gold);
    margin-top: 12px; animation: rule-draw 0.7s var(--ease) 0.55s forwards; }
  @keyframes rule-draw { to { width: 56px; } }
  /* per-word "fade-in-blur" text reveal on questions (vanilla port of motion's TextReveal) */
  .wr { display: inline-block; opacity: 0; filter: blur(10px); transform: translateY(0.3em);
    animation: word-in 0.55s var(--ease) forwards; }
  @keyframes word-in { to { opacity: 1; filter: blur(0); transform: none; } }
  /* the rest of the step follows the question in a quiet sequence */
  .wiz-anim .wiz-hint, .wiz-anim .wiz-input, .wiz-anim .wiz-continue, .wiz-anim .country-list {
    opacity: 0; animation: step-in 0.5s var(--ease) forwards; }
  .wiz-anim .wiz-hint { animation-delay: 0.28s; }
  .wiz-anim .wiz-input, .wiz-anim .country-list { animation-delay: 0.36s; }
  .wiz-anim .wiz-continue { animation-delay: 0.44s; }
  .wiz-anim .wiz-opt { opacity: 0; animation: step-in 0.45s var(--ease) forwards;
    animation-delay: calc(0.34s + var(--i, 0) * 60ms); }
  .wiz-hint { color: var(--ink-soft); font-size: 0.9rem; margin-bottom: 22px; }
  .wiz-choices { display: flex; flex-direction: column; gap: 10px; }
  .wiz-opt {
    display: flex; align-items: center; gap: 12px; text-align: left; width: 100%;
    background: var(--bg); border: 1.5px solid var(--border); border-radius: 14px;
    padding: 15px 18px; font: inherit; font-size: 1rem; font-weight: 500; color: var(--ink);
    cursor: pointer;
    transition: transform 0.15s var(--ease), border-color 0.2s var(--ease), background 0.2s var(--ease), box-shadow 0.2s var(--ease);
  }
  .wiz-opt:hover { border-color: var(--border-hi); transform: translateY(-1px); }
  .wiz-opt:active { transform: scale(0.985); }
  .wiz-opt.picked { background: var(--accent); color: #fff; border-color: var(--accent); box-shadow: 0 10px 26px -12px var(--accent); }
  .wiz-opt .tick { margin-left: auto; opacity: 0; }
  .wiz-opt.picked .tick { opacity: 1; }
  .wiz-input {
    width: 100%; font: inherit; font-size: 1.05rem; padding: 13px 16px; border: 1.5px solid var(--border);
    border-radius: 14px; background: var(--bg);
    transition: border-color 0.2s var(--ease), box-shadow 0.2s var(--ease);
  }
  .wiz-input:focus { outline: none; border-color: var(--border-hi); box-shadow: 0 0 0 3px var(--glow); }
  .wiz-continue { margin-top: 18px; }
  .wiz-continue .cta { width: 100%; border-radius: 14px; }

  /* country picker */
  .country-search { margin-bottom: 12px; }
  .country-list { max-height: 300px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; padding-right: 4px; }
  .country-item {
    display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
    background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 11px 15px;
    font: inherit; font-size: 0.98rem; color: var(--ink); cursor: pointer;
    transition: border-color 0.15s var(--ease), background 0.15s var(--ease), transform 0.1s var(--ease);
  }
  .country-item:hover { border-color: var(--border-hi); background: var(--card); transform: translateX(2px); }
  .country-item .fl { font-size: 1.25rem; line-height: 1; }
  .country-list::-webkit-scrollbar { width: 8px; }
  .country-list::-webkit-scrollbar-thumb { background: var(--border-hi); border-radius: 8px; }

  /* ---------- report ---------- */
  #report { display: none; padding: 24px 0 60px; }
  .report-head { text-align: center; margin-bottom: 32px; }
  .report-head h2 { font-family: var(--head); font-weight: 400; font-size: 2rem; letter-spacing: -0.01em; margin-top: 8px; }
  .report-head p { color: var(--ink-soft); font-size: 0.9rem; margin-top: 4px; }
  .card h3 { font-size: 1.02rem; margin-bottom: 16px; display: flex; align-items: center; gap: 10px; }
  .card h3 .n {
    background: var(--accent); color: #fff; width: 26px; height: 26px; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center; font-size: 0.78rem; flex-shrink: 0;
  }
  .villa-name { font-family: var(--head); font-weight: 400; font-size: 1.7rem; margin-bottom: 4px; }
  .villa-tag { color: var(--accent); font-size: 0.85rem; font-weight: 600; margin-bottom: 16px; }
  .specs { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
  .spec { background: var(--bg-alt); border-radius: 12px; padding: 12px 14px; }
  .spec .v { font-weight: 600; font-size: 1.05rem; }
  .spec .k { font-size: 0.75rem; color: var(--ink-soft); }
  .alt-note { margin-top: 14px; font-size: 0.85rem; color: var(--ink-soft); }

  .big-price { font-family: var(--head); font-size: 2.3rem; color: var(--accent); line-height: 1.2; }
  .price-meta { font-size: 0.9rem; color: var(--ink-soft); margin-top: 6px; }
  .under-market {
    display: inline-block; background: #e8f2ec; color: var(--ok); font-size: 0.82rem;
    font-weight: 600; padding: 4px 12px; border-radius: 999px; margin-top: 12px;
  }
  .urgency { font-size: 0.85rem; margin-top: 12px; color: var(--ink); background: var(--bg-alt); border-radius: 10px; padding: 10px 14px; }

  /* comparison bars */
  .bars { margin-top: 20px; }
  .bars-title { font-size: 0.78rem; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-soft); margin-bottom: 12px; }
  .bar-row { margin-bottom: 14px; }
  .bar-row .bar-label { display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 5px; gap: 10px; }
  .bar-row .bar-label .who { font-weight: 600; }
  .bar-row .bar-label .who small { font-weight: 400; color: var(--ink-soft); }
  .bar-row .bar-label .val { font-variant-numeric: tabular-nums; color: var(--ink-soft); white-space: nowrap; }
  .bar-track { background: var(--bg-alt); border-radius: 4px; height: 14px; overflow: hidden; }
  .bar-fill { height: 100%; width: 0; border-radius: 0 4px 4px 0; background: var(--bar-muted); transition: width 1.1s var(--ease); }
  .bar-row.me .bar-fill { background: var(--accent); }
  .bar-row.me .bar-label .who, .bar-row.me .bar-label .val { color: var(--accent); }

  table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--bg-alt); vertical-align: top; }
  th { font-size: 0.72rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-soft); }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  tr.total td { font-weight: 600; border-bottom: none; background: var(--bg-alt); }
  tr.total td:first-child { border-radius: 8px 0 0 8px; }
  tr.total td:last-child { border-radius: 0 8px 8px 0; }
  .yield-big { font-family: var(--head); font-size: 1.1em; }
  .footnote { font-size: 0.78rem; color: var(--ink-soft); margin-top: 12px; line-height: 1.6; }
  .honest {
    border-left: 3px solid var(--accent); background: var(--bg-alt);
    padding: 12px 16px; border-radius: 0 12px 12px 0; font-size: 0.85rem; margin-top: 14px;
  }

  /* ownership routes */
  .route { border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; }
  .route .rt-name { font-weight: 600; margin-bottom: 3px; display: flex; align-items: center; gap: 9px; }
  .route .rt-name .rn { background: var(--bg-alt); color: var(--accent); width: 22px; height: 22px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 0.75rem; flex-shrink: 0; }
  .route .rt-body { font-size: 0.88rem; color: var(--ink-soft); }
  .own-intro { font-size: 0.92rem; margin-bottom: 16px; }
  .own-one { font-size: 0.95rem; }
  .disclaimer {
    border-left: 3px solid var(--bar-muted); background: var(--bg-alt);
    padding: 11px 15px; border-radius: 0 12px 12px 0; font-size: 0.82rem; color: var(--ink-soft); margin-top: 14px;
  }
  .pay-line { font-size: 0.95rem; margin-bottom: 14px; }
  .pay-money { font-size: 0.9rem; color: var(--ink-soft); background: var(--bg-alt); border-radius: 10px; padding: 11px 15px; }
  .pay-money b { color: var(--ink); font-weight: 600; }

  ul.fit { list-style: none; }
  ul.fit li {
    padding: 7px 0 7px 30px; position: relative;
    opacity: 0; transform: translateX(-10px);
    transition: opacity 0.5s var(--ease), transform 0.5s var(--ease);
  }
  .in ul.fit li { opacity: 1; transform: none; }
  ul.fit li::before {
    content: "✓"; position: absolute; left: 4px; color: var(--accent); font-weight: 700;
    transform: scale(0); transition: transform 0.4s var(--ease) 0.15s;
  }
  .in ul.fit li::before { transform: scale(1); }

  .next-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
  .next-actions a, .next-actions button {
    flex: 1 1 140px; text-align: center; text-decoration: none; font: inherit; font-size: 0.9rem;
    font-weight: 600; padding: 12px 10px; border-radius: 12px; cursor: pointer;
    border: 1.5px solid var(--accent); color: var(--accent); background: none;
    transition: transform 0.2s var(--ease), box-shadow 0.2s var(--ease);
  }
  .next-actions a:hover, .next-actions button:hover { transform: translateY(-2px); box-shadow: 0 8px 24px -14px var(--accent); }
  .next-actions .primary { background: var(--accent); color: #fff; }
  .captured { font-size: 0.9rem; color: var(--ok); font-weight: 600; margin-top: 14px; }

  footer { padding: 26px 0 60px; text-align: center; }
  footer .made-by { font-size: 0.8rem; color: var(--ink); margin-bottom: 10px; }
  footer .made-by em { font-family: var(--head); color: var(--accent); }
  footer p.legal { font-size: 0.73rem; color: var(--ink-soft); max-width: 560px; margin: 0 auto; line-height: 1.7; }
  .back-link { display: block; text-align: center; margin-top: 10px; }
  .back-link button { background: none; border: none; font: inherit; color: var(--ink-soft); text-decoration: underline; cursor: pointer; font-size: 0.85rem; }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
    [data-anim] { opacity: 1; transform: none; }
    .modal-sheet, .modal-backdrop { opacity: 1 !important; transform: none !important; }
    .wiz-anim { opacity: 1; transform: none; }
    .wr, .wiz-anim .wiz-hint, .wiz-anim .wiz-input, .wiz-anim .wiz-continue,
    .wiz-anim .country-list, .wiz-anim .wiz-opt, .wiz-eyebrow { opacity: 1; filter: none; transform: none; }
    .wiz-q::after { width: 56px; }
    ul.fit li { opacity: 1; transform: none; }
    ul.fit li::before { transform: scale(1); }
  }
  @media print {
    header, .demo-badge, .next-actions, .back-link, #modal, .hero { display: none !important; }
    #report { display: block !important; padding: 0; }
    body { background: #fff; }
    .card { box-shadow: none; break-inside: avoid; }
    [data-anim] { opacity: 1 !important; transform: none !important; }
  }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="brand">
      <span class="brand-name">Rejig Labs</span>
      <span class="brand-sub" id="t-brand-sub"></span>
    </div>
    <nav class="langs" id="langs"></nav>
  </div>
</header>

<div class="demo-badge" id="demo-badge"></div>

<section class="hero wrap">
  <div class="hero-blob"></div>
  <div class="eyebrow">Suvarna Pool Villas · Phuket</div>
  <h1 id="t-hero-h1"></h1>
  <div class="price-line" id="t-hero-price"></div>
  <p class="sub" id="t-hero-sub"></p>

/* ============================================================ state */
let lang = "th";
let langLocked = false;   // true once the user overrides via the flag switch
const answers = {};
let curKey = null;
const $ = (id) => document.getElementById(id);
const T = () => I18N[lang];
const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

const FLAGS = { th: "🇹🇭", en: "🇬🇧", ru: "🇷🇺", zh: "🇨🇳" };
const LANG_NAMES = { th: "ไทย", en: "English", ru: "Русский", zh: "中文" };

/* ============================================================ the locked question set (#194)
   show(a): step is skipped entirely when false (conditionals never appear). */
const STEPS = [
  { key: "country",  type: "country" },
  { key: "name",     type: "text",   q: "qName",     hint: "hintName" },
  { key: "purpose",  type: "choice", q: "qPurpose",  opts: "purposes" },
  { key: "beds",     type: "choice", q: "qBeds",     opts: "bedsOpts" },
  { key: "kids",     type: "choice", q: "qKids",     opts: "kidsOpts", show: (a) => a.purpose !== "invest" },
  { key: "ownuse",   type: "choice", q: "qOwnUse",   opts: "ownuses",  show: (a) => a.purpose !== "live" },
  { key: "budget",   type: "choice", q: "qBudget",   opts: "budgets" },
  { key: "pay",      type: "choice", q: "qPay",      opts: "pays" },
  { key: "firsttime",type: "choice", q: "qFirst",    opts: "firsts",   show: (a) => C(a.country).foreign },
  { key: "timeline", type: "choice", q: "qTimeline", opts: "timelines" },
  { key: "phuket",   type: "choice", q: "qPhuket",   opts: "phukets" },
  { key: "channel",  type: "choice", q: "qChannel",  hint: "hintChannel", opts: "channels" }
];
const visibleSteps = () => STEPS.filter((s) => !s.show || s.show(answers));

/* ============================================================ chrome */
function renderLangBar() {
  $("langs").innerHTML = Object.keys(I18N).map(
    (l) => `<button class="${l === lang ? "on" : ""}" onclick="setLang('${l}', true)" aria-label="${LANG_NAMES[l]}" title="${LANG_NAMES[l]}">${FLAGS[l]}</button>`
  ).join("");
}

function setLang(l, manual) {
  lang = l;
  if (manual) langLocked = true;
  document.documentElement.lang = l;
  renderChrome();
  if ($("report").style.display === "block") renderReport();
  else if (curKey) renderStep();
}

function renderChrome() {
  const t = T();
  renderLangBar();
  $("t-brand-sub").textContent = t.brandSub;
  $("demo-badge").textContent = t.demoBadge;
  $("t-hero-h1").textContent = t.heroH1;
  $("t-hero-price").textContent = t.heroPrice;
  $("t-hero-sub").textContent = t.heroSub;
  $("t-hero-cta").textContent = t.heroCta;
  $("t-footer").textContent = t.footer;
}

/* ============================================================ wizard (full-screen modal) */
function startWizard() {
  curKey = "country";
  const m = $("modal");
  m.classList.add("open");
  m.setAttribute("aria-hidden", "false");
  document.body.style.overflow = "hidden";
  $("progress-fill").style.transform = "scaleX(0)";   // so the fill animates up to 20% on open
  renderStep();
}

function closeWizard() {
  const m = $("modal");
  m.classList.remove("open");
  m.setAttribute("aria-hidden", "true");
  document.body.style.overflow = "";
}

/* progress: opens at 20% ("already in progress"), climbs toward 100% per visible step */
function updateProgress() {
  const vis = visibleSteps();
  const i = Math.max(0, vis.findIndex((s) => s.key === curKey));
  const pct = 20 + (i / vis.length) * 80;
  requestAnimationFrame(() => { $("progress-fill").style.transform = `scaleX(${(pct / 100).toFixed(3)})`; });
}

/* per-word "fade-in-blur" question reveal; Intl.Segmenter splits Thai/Chinese correctly */
function wordReveal(txt) {
  if (reducedMotion || !window.Intl?.Segmenter) return txt;
  let i = 0;
  return [...new Intl.Segmenter(lang, { granularity: "word" }).segment(txt)]
    .map((s) => /\S/.test(s.segment)
      ? `<span class="wr" style="animation-delay:${80 + i++ * 45}ms">${s.segment}</span>`
      : s.segment)
    .join("");
}

/* real-estate flourish: replay the blueprint scan-line on every step change */
function playFlourish() {
  if (reducedMotion) return;
  const f = $("flourish");
  f.classList.remove("play");
  void f.offsetWidth;
  f.classList.add("play");
}

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && $("modal").classList.contains("open")) closeWizard();
});

function renderStep() {
  const t = T();
  const step = STEPS.find((s) => s.key === curKey);
  const vis = visibleSteps();
  const isFirst = vis.findIndex((s) => s.key === curKey) === 0;
  $("wiz-back").textContent = t.back;
  $("wiz-back").classList.toggle("show", !isFirst);

  let inner = "";
  if (step.type === "country") {
    inner = `
      <div class="wiz-q">${wordReveal(t.qCountry)}</div>
      <div class="wiz-hint">${t.hintCountry}</div>
      <input class="wiz-input country-search" id="country-search" placeholder="${t.countrySearch}" oninput="filterCountries(this.value)" autocomplete="off">
      <div class="country-list" id="country-list"></div>`;
  } else if (step.type === "text") {
    inner = `
      <div class="wiz-q">${wordReveal(t[step.q])}</div>
      <div class="wiz-hint">${t[step.hint]}</div>
      <input class="wiz-input" id="text-input" placeholder="${t.namePlaceholder}"
             value="${answers[step.key] ? escapeHtml(answers[step.key]) : ""}"
             onkeydown="if(event.key==='Enter'){event.preventDefault();submitText()}" autocomplete="off">
      <div class="wiz-continue"><button class="cta" onclick="submitText()">${t.continue}</button></div>`;
  } else {
    const opts = t[step.opts];
    inner = `
      <div class="wiz-q">${wordReveal(t[step.q])}</div>
      ${step.hint ? `<div class="wiz-hint">${t[step.hint]}</div>` : ""}
      <div class="wiz-choices">${Object.entries(opts).map(([val, label], idx) =>
        `<button class="wiz-opt ${answers[step.key] === val ? "picked" : ""}" style="--i:${idx}" onclick="pick('${step.key}','${val}')">${label}<span class="tick">✓</span></button>`
      ).join("")}</div>`;
  }
  const stepNo = vis.findIndex((s) => s.key === curKey) + 1;
  $("wiz-step").innerHTML = `<div class="wiz-anim">
    <div class="wiz-eyebrow">Suvarna &middot; ${stepNo} / ${vis.length}</div>${inner}</div>`;
  updateProgress();
  playFlourish();
  if (step.type === "country") filterCountries("");
  if (step.type === "text") setTimeout(() => $("text-input")?.focus(), 60);
}

function filterCountries(q) {
  q = q.trim().toLowerCase();
  const list = COUNTRIES.filter((c) => {
    if (c.code === "XX") return q === "";           // "Another country" only when not searching
    return Object.values(c.nm).some((n) => n.toLowerCase().includes(q)) || c.code.toLowerCase() === q;
  });
  // always keep "Another country" reachable at the end
  if (q !== "" && !list.find((c) => c.code === "XX")) list.push(C("XX"));
  $("country-list").innerHTML = list.map((c) =>
    `<button class="country-item" onclick="pickCountry('${c.code}')"><span class="fl">${c.fl}</span>${countryName(c)}</button>`
  ).join("");
}

function pickCountry(code) {
  answers.country = code;
  if (!langLocked) { lang = C(code).dl; document.documentElement.lang = lang; renderChrome(); }
  goNext();
}

function submitText() {
  const v = $("text-input").value.trim();
  if (!v) { $("text-input").focus(); return; }
  answers.name = v;
  goNext();
}

function pick(key, val) {
  answers[key] = val;
  const btn = event?.currentTarget;
  if (btn) { btn.parentElement.querySelectorAll(".wiz-opt").forEach((b) => b.classList.remove("picked")); btn.classList.add("picked"); }
  setTimeout(goNext, reducedMotion ? 0 : 200);
}

/* play the exit pan on the current step, then render the next one */
function goStep(key) {
  const anim = document.querySelector("#wiz-step .wiz-anim");
  if (reducedMotion || !anim) { curKey = key; renderStep(); return; }
  anim.classList.add("exit");
  setTimeout(() => { curKey = key; renderStep(); }, 260);
}

function goNext() {
  const vis = visibleSteps();
  const i = vis.findIndex((s) => s.key === curKey);
  if (i >= 0 && i < vis.length - 1) goStep(vis[i + 1].key);
  else submitWizard();
}

function goBack() {
  const vis = visibleSteps();
  const i = vis.findIndex((s) => s.key === curKey);
  if (i > 0) goStep(vis[i - 1].key);
}

function submitWizard() {
  // ponytail: demo has no backend; a real deploy POSTs `answers` to the capture endpoint here
  answers.ownuse = answers.ownuse || "none";
  answers.kids = answers.kids || "no";
  closeWizard();
  document.querySelector(".hero").style.display = "none";
  renderReport();
  window.scrollTo({ top: 0, behavior: reducedMotion ? "auto" : "smooth" });
}

/* ============================================================ recommendation */
function recommend(a) {
  if (a.beds === "b4") return a.budget === "hi" ? "D" : "C";
  if (a.purpose !== "invest" && a.budget !== "lo") return "A1";
  return "A";
}

/* ============================================================ report */
function renderReport() {
  const a = answers;
  const t = T();
  const country = C(a.country);
  const typeKey = recommend(a);
  const v = VILLAS[typeKey];
  const ph = v.placeholder ? "*" : "";
  const psm = v.price / v.usable;
  const underPct = Math.round((1 - psm / MARKET.thalangMedianPsm) * 100);
  const tag = a.purpose === "live" ? t.typeTagLive : a.purpose === "invest" ? t.typeTagInvest : t.typeTagBoth;
  const altKey = typeKey === "A" ? "A1" : "A";

  const ownWeeks = a.purpose === "live" ? 0 : OWN_USE_WEEKS[a.ownuse] || 0;
  const ownFactor = (52 - ownWeeks) / 52;
  const ownPct = Math.round((1 - ownFactor) * 100);
  const grossLo = v.price * MARKET.grossYieldLo, grossHi = v.price * MARKET.grossYieldHi;
  const adjLo = grossLo * ownFactor, adjHi = grossHi * ownFactor;
  const netLo = adjLo * (1 - MARKET.costShare), netHi = adjHi * (1 - MARKET.costShare);

  const sections = [];
  let n = 0;
  const sec = (title, body) => { n++; sections.push(`<div class="card" data-anim><h3><span class="n">${n}</span>${title}</h3>${body}</div>`); };

  /* --- villa --- */
  const specCells = [
    [t.specs.land, `${Math.round(v.landSqm)} ${t.sqm}`],
    [t.specs.usable, `${Math.round(v.usable)} ${t.sqm}`],
    [t.specs.beds, `${v.beds} ${t.bedsUnit}`.trim()],
    [t.specs.pool, `${v.pool.toFixed(1)} ${t.sqm}`],
    [t.specs.garage, `${v.garage} ${t.cars}`],
    [t.specs.units, `${v.units} ${t.unitsUnit}`]
  ].map(([k, val]) => `<div class="spec"><div class="v">${val}</div><div class="k">${k}</div></div>`).join("");
  sec(t.s1, `
    <div class="villa-name">${t.typeName(typeKey)}</div>
    <div class="villa-tag">${tag}</div>
    <div class="specs">${specCells}</div>
    ${v.bigTerrace ? `<div class="alt-note">${t.bigTerraceNote}</div>` : ""}
    <div class="alt-note">${t.altNote(altKey, VILLAS[altKey].units)}</div>`);

  /* --- price + market --- */
  const marketLine = psm < MARKET.thalangMedianPsm
    ? `<span class="under-market">${t.underMarket(underPct)}</span>`
    : `<span class="under-market" style="background:var(--bg-alt);color:var(--accent)">${t.premiumUnit}</span>`;
  const urgency = a.timeline === "now" ? `<div class="urgency">⏳ ${t.urgencyNow}</div>`
    : a.timeline === "explore" ? `<div class="urgency">📎 ${t.urgencyExplore}</div>` : "";
  const maxPsm = Math.max(psm, MARKET.thalangMedianPsm, MARKET.comparablePsm);
  const barRow = (me, name, priceTxt, val) => `
    <div class="bar-row ${me ? "me" : ""}">
      <div class="bar-label">
        <span class="who">${name} <small>· ${t.cmpPrice(priceTxt)}</small></span>
        <span class="val">${Math.round(val).toLocaleString()}</span>
      </div>
      <div class="bar-track"><div class="bar-fill" data-w="${(val / maxPsm * 100).toFixed(1)}"></div></div>
    </div>`;
  sec(t.s2, `
    <div class="big-price">${t.priceFrom} <span data-count="${(v.price / 1e6).toFixed(2)}" data-fmt="m">0</span>${ph}</div>
    <div class="price-meta">${t.phase(v.phase)} · ${t.psm(Math.round(psm).toLocaleString())}</div>
    ${marketLine}
    ${urgency}
    <div class="footnote">${t.phaseNote}</div>
    <div class="bars">
      <div class="bars-title">${t.barsTitle}</div>
      ${barRow(true, t.cmpRows.suvarna(typeKey) + ph, t.mTHB(v.price), psm)}
      ${barRow(false, t.cmpRows.median, t.mTHB(MARKET.thalangMedianPrice), MARKET.thalangMedianPsm)}
      ${barRow(false, t.cmpRows.comp, t.mTHB(MARKET.comparablePrice), MARKET.comparablePsm)}
    </div>
    <div class="footnote">${t.cmpNote}</div>`);

  /* --- ownership (accuracy-critical: framed, never asserted; sized by firsttime) --- */
  let ownBody;
  if (!country.foreign) {
    ownBody = `<div class="own-one">${t.ownThai}</div>`;
  } else if (a.firsttime === "no") {
    ownBody = `<div class="own-one">${t.ownCondensed}</div>`;
  } else {
    ownBody = `<div class="own-intro">${t.ownIntroForeign}</div>` +
      t.routes.map((r) => `<div class="route"><div class="rt-name"><span class="rn">${r.n}</span>${r.name}</div><div class="rt-body">${r.body}</div></div>`).join("");
  }
  sec(t.sOwn, ownBody + `<div class="disclaimer">${t.ownDisclaimer}</div>`);

  /* --- payment + moving the money (from pay method + country) --- */
  const payLine = a.pay === "cash" ? t.payCash
    : a.pay === "installments" ? t.payInstall
    : (country.foreign ? t.payFinForeign : t.payFinThai);
  const moneyLine = country.money === "ru" ? t.moneyRu
    : country.money === "cn" ? t.moneyCn
    : country.money === "intl" ? t.moneyIntl : "";
  sec(t.sPay,
    `<div class="pay-line">${payLine}</div>` +
    (moneyLine ? `<div class="pay-money"><b>💱</b> ${moneyLine}</div>` : "") +
    (a.pay !== "financing" ? `<div class="footnote">${t.payDisclaimer}</div>` : ""));

  /* --- ROI (skip for pure live) --- */
  if (a.purpose !== "live") {
    const ownRow = ownWeeks > 0 ? `
        <tr><td>${t.roiRows.own(ownWeeks, ownPct)}</td><td class="num">−${t.thb(grossLo - adjLo)}</td><td class="num">−${t.thb(grossHi - adjHi)}</td></tr>` : "";
    sec(t.s3, `
      <table>
        <tr><th>${t.roiHead.item}</th><th class="num">${t.roiHead.lo}</th><th class="num">${t.roiHead.hi}</th></tr>
        <tr><td>${t.roiRows.price}${ph}</td><td class="num" colspan="2" style="text-align:center">${t.thb(v.price)}</td></tr>
        <tr><td>${t.roiRows.gross}</td><td class="num">${t.thb(grossLo)}</td><td class="num">${t.thb(grossHi)}</td></tr>${ownRow}
        <tr><td>${t.roiRows.costs}</td><td class="num">−${t.thb(adjLo * MARKET.costShare)}</td><td class="num">−${t.thb(adjHi * MARKET.costShare)}</td></tr>
        <tr class="total"><td>${t.roiRows.net}</td><td class="num">${t.thb(netLo)}</td><td class="num">${t.thb(netHi)}</td></tr>
        <tr class="total"><td>${t.roiRows.yield}</td>
          <td class="num yield-big"><span data-count="${(netLo / v.price * 100).toFixed(1)}" data-suffix="%">0%</span></td>
          <td class="num yield-big"><span data-count="${(netHi / v.price * 100).toFixed(1)}" data-suffix="%">0%</span></td></tr>
        <tr><td>${t.roiRows.monthly}</td><td class="num">${t.thb(netLo / 12)}</td><td class="num">${t.thb(netHi / 12)}</td></tr>
      </table>
      <div class="honest">${t.honest}</div>`);
  }

  /* --- family fit (skip for pure invest) --- */
  if (a.purpose !== "invest") {
    const fitItems = t.fit(v).concat(a.kids === "yes" ? [t.fitKids] : []);
    sec(t.s4, `<ul class="fit">${fitItems.map((li, i) => `<li style="transition-delay:${0.1 + i * 0.12}s">${li}</li>`).join("")}</ul>`);
  }

  /* --- next step --- */
  const primaryCta = a.phuket === "notyet" ? t.ctaVideo : t.ctaGallery;
  const channelLabel = t.channels[a.channel] || t.channels.email;
  sec(t.s5, `
    <div class="captured">${t.captured(escapeHtml(a.name), channelLabel)}</div>
    <div class="next-actions">
      <a class="primary" href="#" onclick="return false">${primaryCta}</a>
      <a href="#" onclick="return false">${t.actions.line}</a>
      <a href="#" onclick="return false">${t.actions.wa}</a>
      <button onclick="window.print()">${t.actions.pdf}</button>
    </div>
    <div class="back-link"><button onclick="resetForm()">${t.backLink}</button></div>`);

  $("report").innerHTML = `
    <div class="report-head" data-anim>
      <div class="eyebrow">${t.repEyebrow}</div>
      <h2>${t.repTitle(escapeHtml(a.name))}</h2>
      <p>${t.repSub}</p>
    </div>
    ${sections.join("")}`;
  $("report").style.display = "block";
  initAnims();
}

/* ---------- animations: scroll reveal, bar grow, count-up ---------- */
function initAnims() {
  const io = new IntersectionObserver((entries) => {
    entries.forEach((entry) => {
      if (!entry.isIntersecting) return;
      const el = entry.target;
      el.classList.add("in");
      el.querySelectorAll(".bar-fill").forEach((b) => {
        requestAnimationFrame(() => { b.style.width = b.dataset.w + "%"; });
      });
      el.querySelectorAll("[data-count]").forEach(countUp);
      io.unobserve(el);
    });
  }, { threshold: 0.2 });
  document.querySelectorAll("#report [data-anim]").forEach((el) => io.observe(el));
}

function countUp(el) {
  const target = parseFloat(el.dataset.count);
  const dec = (el.dataset.count.split(".")[1] || "").length;
  const fmt = (num) => el.dataset.fmt === "m"
    ? T().mTHB(num * 1e6)
    : num.toFixed(dec) + (el.dataset.suffix || "");
  if (reducedMotion) { el.textContent = fmt(target); return; }
  const dur = 1000, t0 = performance.now();
  (function tick(now) {
    const p = Math.min((now - t0) / dur, 1);
    el.textContent = fmt(target * (1 - Math.pow(1 - p, 3)));
    if (p < 1) requestAnimationFrame(tick);
  })(t0);
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function resetForm() {
  $("report").style.display = "none";
  $("report").innerHTML = "";
  document.querySelector(".hero").style.display = "";
  startWizard();   // reopen the modal at the country step to edit answers
}

renderChrome();   // the modal wizard opens on the CTA click, not on load
</script>
</body>
